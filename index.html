<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Loop Me</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10b981">

  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

  <style>
    body { margin: 0; font-family: system-ui, sans-serif; }
    #map { height: 100vh; }

    .bar {
      position: absolute;
      top: 10px;
      left: 50px;
      right: 10px;
      z-index: 1000;
      display: flex;
      gap: 8px;
      overflow-x: auto;
    }

    .bar select, .bar button {
      background: white;
      border: 1px solid #ccc;
      border-radius: 12px;
      padding: 10px 12px;
      font-size: 14px;
      box-shadow: 0 2px 8px rgba(0,0,0,.2);
    }

    .bar button.primary {
      background: #10b981;
      color: #fff;
      border-color: #10b981;
    }

    .status {
      position: absolute;
      bottom: 10px;
      left: 10px;
      background: white;
      padding: 8px 12px;
      border-radius: 10px;
      font-size: 14px;
      box-shadow: 0 2px 8px rgba(0,0,0,.2);
    }

    .distance-popup {
      background: #10b981;
      color: white;
      padding: 6px 10px;
      border-radius: 8px;
      font-weight: bold;
      font-size: 13px;
    }
  </style>
</head>
<body>

<div class="bar">
  <select id="distance">
    <option value="6">6 miles</option>
    <option value="9" selected>9 miles</option>
    <option value="12">12 miles</option>
    <option value="15">15 miles</option>
  </select>
  <button class="primary" onclick="generateLoop()">Loop me</button>
  <button id="followBtn" onclick="toggleFollow()">📍 Follow</button>
  <button id="customBtn" onclick="toggleCustom()">📍 Custom start</button>
</div>

<div id="map"></div>
<div class="status" id="status">Starting…</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  /* ================= CONFIG ================= */

  const ORS_API_KEY = "eyJvcmciOiI1YjNjZTM1OTc4NTExMTAwMDFjZjYyNDgiLCJpZCI6IjQwZGVjNjQyZjYxMzQ2YjA5OTgwZDk0Y2QyMGU5NGIzIiwiaCI6Im11cm11cjY0In0=";

  /* ================= STATE ================= */

  let lastPos = null;
  let follow = true;
  let firstFix = true;
  let customStart = null;

  let userMarker = null;
  let accuracyCircle = null;
  let routeLine = null;
  let routePopup = null;

  /* ================= MAP ================= */

  const map = L.map("map").setView([55.9533, -3.1883], 12);

  const osm = L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png");
  const sat = L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{x}/{y}");

  osm.addTo(map);
  L.control.layers({ "Map": osm, "Satellite": sat }, null, { position: "bottomright" }).addTo(map);

  const statusEl = document.getElementById("status");
  const setStatus = t => statusEl.textContent = t;

  /* ================= GEOLOCATION ================= */

  if ("geolocation" in navigator) {
    navigator.geolocation.watchPosition(pos => {
      const { latitude, longitude, accuracy } = pos.coords;
      lastPos = [latitude, longitude];

      if (follow) {
        map[firstFix ? "setView" : "panTo"]([latitude, longitude], firstFix ? 18 : undefined);
        firstFix = false;
      }

      if (userMarker) map.removeLayer(userMarker);
      userMarker = L.marker([latitude, longitude]).addTo(map);

      if (accuracyCircle) map.removeLayer(accuracyCircle);
      accuracyCircle = L.circle([latitude, longitude], {
        radius: Math.max(accuracy, 15),
        color: "#3b82f6",
        fillOpacity: 0.12
      }).addTo(map);

      setStatus(`Tracking ±${Math.round(accuracy)}m`);
    });
  } else {
    setStatus("Geolocation not supported");
  }

  /* ================= CONTROLS ================= */

  function toggleFollow() {
    follow = !follow;
    firstFix = true;
    document.getElementById("followBtn").classList.toggle("primary", follow);
  }

  function toggleCustom() {
    customStart = null;
    setStatus("Tap map to set custom start");
    map.once("click", e => {
      customStart = [e.latlng.lat, e.latlng.lng];
      L.marker(customStart).addTo(map);
      setStatus("Custom start set");
    });
  }

  /* ================= ROUTING ================= */

  function generateLoop() {
    const start = customStart ?? lastPos;
    if (!start) {
      setStatus("Waiting for GPS…");
      return;
    }

    const miles = +document.getElementById("distance").value;
    const meters = miles * 1609.34;
    const offset = (meters / 3.2) / 111139;

    const [lat, lon] = start;

    const jitter = () => (Math.random() * 2 - 1) * offset;

    const coords = [
      [lon, lat],
      [lon + jitter(), lat + jitter()],
      [lon + jitter(), lat + jitter()],
      [lon, lat]
    ];

    fetch("https://api.openrouteservice.org/v2/directions/foot-walking", {
      method: "POST",
      headers: {
        "Authorization": ORS_API_KEY,
        "Content-Type": "application/json",
        "Accept": "application/geo+json"
      },
      body: JSON.stringify({
        coordinates: coords,
        instructions: false,
        options: { avoid_features: ["highways"] }
      })
    })
    .then(r => r.json())
    .then(data => {
      if (!data.features?.length) throw "No route";

      const geo = data.features[0];
      const latlngs = geo.geometry.coordinates.map(c => [c[1], c[0]]);
      const dist = geo.properties.summary.distance / 1609.34;

      if (routeLine) map.removeLayer(routeLine);
      routeLine = L.polyline(latlngs, { color: "#10b981", weight: 4 }).addTo(map);
      map.fitBounds(routeLine.getBounds());

      if (routePopup) map.closePopup(routePopup);
      routePopup = L.popup({ className: "distance-popup", closeButton: false })
        .setLatLng(latlngs[Math.floor(latlngs.length / 2)])
        .setContent(`${dist.toFixed(2)} mi`)
        .openOn(map);

      setStatus("Route ready");
    })
    .catch(() => setStatus("Routing failed – try again"));
  }
</script>
</body>
</html>

<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Loop Me (Dev Mode)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10b981">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="manifest" href="manifest.json">
  <style>
    body {
      margin: 0;
      font-family: system-ui, sans-serif;
    }
    #map {
      height: 100vh;
    }
    .status {
      position: absolute;
      bottom: 10px;
      left: 10px;
      background: white;
      padding: 8px 12px;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
      font-size: 14px;
    }
    .bar {
      position: absolute;
      top: 10px;
      left: 50px;
      right: 10px;
      z-index: 1000;
      display: flex;
      gap: 8px;
      flex-wrap: nowrap;
      overflow-x: auto;
    }
    .bar button {
      background: white;
      border: 1px solid #ccc;
      border-radius: 12px;
      padding: 10px 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
      font-size: 14px;
    }
    .bar button.primary {
      background: #10b981;
      color: #fff;
      border-color: #10b981;
    }
    .bar button:active {
      transform: translateY(1px);
    }
    .bar::-webkit-scrollbar {
      display: none;
    }
    .distance-popup {
      background: #10b981;
      color: white;
      padding: 6px 10px;
      border-radius: 8px;
      font-weight: bold;
      box-shadow: 0 2px 6px rgba(0,0,0,0.2);
      font-size: 13px;
    }
  </style>
</head>
<body>

<div class="bar">
  <select id="distanceSelect" onchange="onDistanceChange()">
    <option value="6">6 miles</option>
    <option value="9" selected>9 miles</option>
    <option value="12">12 miles</option>
    <option value="15">15 miles</option>
  </select>
  <button class="primary" onclick="generateLoop()">Loop me</button>
  <button id="followBtn" onclick="toggleFollow()"> Follow Me</button>
  <button id="customStartBtn" onclick="toggleCustomStart()"> Custom Start: OFF</button>
  <button onclick="reloadLastRoute()"> Reload route</button>

</div>

<div id="map"></div>
<div class="status" id="status">Loading...</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>

  const GH_API_KEY = "8b7bdd6e-0343-4430-931c-242dea8d7b20";
  let lastPosition = null;
  let routeLine = null;
  let marker = null;
  let accuracyCircle = null;
  let firstFix = true;
  let followUser = true;
  let useCustomStart = false;  
  let customStart = null;
  let customMarker = null;

  const statusEl = document.getElementById("status");
  const setStatus = (t) => statusEl.textContent = t;

  // Map setup
  const map = L.map("map").setView([55.9533, -3.1883], 12);
  map.options.pan = { animate: true, duration: 1 };

  const osmLayer = L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    attribution: "© OpenStreetMap contributors"
  });

  const esriLayer = L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{x}/{y}", {
    attribution: "Tiles © Esri"
  });

  osmLayer.addTo(map);

  const baseMaps = {
    "OpenStreetMap": osmLayer,
    "Satellite": esriLayer
  };

 L.control.layers(baseMaps, null, { position: "bottomright" }).addTo(map);

   function toggleFollow() {
     followUser = !followUser;
     if (followUser) firstFix = true;

     const btn = document.getElementById("followBtn");
     btn.classList.toggle("primary", followUser);
     btn.textContent = followUser ? " Follow Me" : " Explore";

     setStatus(`Follow mode: ${followUser ? 'ON' : 'Explore'}`);
}
 

  function toggleCustomStart() {
    useCustomStart = !useCustomStart;
    if (useCustomStart) followUser = false;
    const btn = document.getElementById("customStartBtn");
    btn.classList.toggle("primary", useCustomStart);
    btn.style.background = useCustomStart ? "#10b981" : "#ef4444"; // green / red
    btn.style.borderColor = useCustomStart ? "#10b981" : "#ef4444";
    btn.style.color = "#fff";
    btn.textContent = useCustomStart ? " Custom Start: ON" : " Custom Start: OFF";
  if (!useCustomStart) {
    // Clear marker and coordinates when toggled off
    if (customMarker) {
      map.removeLayer(customMarker);
      customMarker = null;
    }
    customStart = null;
    setStatus("Custom start disabled. Using current location.");
  } else {
    setStatus("Tap the map to set a custom start point.");
  }

  }

  // Track GPS
  if ("geolocation" in navigator) {
    setStatus("Tracking your location...");
    navigator.geolocation.watchPosition(
      (pos) => {
        const lat = pos.coords.latitude;
        const lon = pos.coords.longitude;
        const accuracy = pos.coords.accuracy;
        lastPosition = [lat, lon];

        if (followUser) {
          if (firstFix) {
            map.setView([lat, lon], 18);
            firstFix = false;
          } else {
            map.panTo([lat, lon], { animate: true });
          }
        }

        if (marker) map.removeLayer(marker);
        marker = L.marker([lat, lon]).addTo(map).bindPopup("You are here");

        if (accuracyCircle) map.removeLayer(accuracyCircle);
        accuracyCircle = L.circle([lat, lon], {
          radius: Math.max(accuracy, 15),
          color: "#3b82f6",
          fillColor: "#3b82f6",
          fillOpacity: 0.12,
          weight: 2
        }).addTo(map);

        setStatus(`Tracking (+/-${Math.round(accuracy)}m)`);
      },
      () => setStatus("Could not track location"),
      { enableHighAccuracy: true, maximumAge: 5000, timeout: 10000 }
    );
  } else {
    setStatus("Geolocation not supported");
  }

  // Distance selection
  let selectedMiles = 9;
  let minMiles = 7.2;
  let maxMiles = 10.8;

  function selectDistance(m) {
    selectedMiles = m;
    const tolerance = 0.2;
    minMiles = m * (1 - tolerance);
    maxMiles = m * (1 + tolerance);
    setStatus(`Distance set: ${m} miles (range: ${minMiles.toFixed(2)} to ${maxMiles.toFixed(2)})`);

  }

  function onDistanceChange() {
    const m = parseInt(document.getElementById("distanceSelect").value, 10);
    selectDistance(m);
  }

 function reloadLastRoute() {
  const saved = localStorage.getItem("lastRoute");
  if (!saved) {
    setStatus("No saved route to reload");
    return;
  }

  const latlngs = JSON.parse(saved);
  const distance = parseFloat(localStorage.getItem("lastDistance"));

  if (routeLine) map.removeLayer(routeLine);

  routeLine = L.polyline(latlngs, {
    color: "#10b981",
    weight: 4
  }).addTo(map);

  if (followUser) {
    map.fitBounds(routeLine.getBounds());
}

  if (!isNaN(distance)) {
    setStatus(`Reloaded route (${distance.toFixed(2)} mi)`);
  } else {
    setStatus("Reloaded route");
  }
}

  // Set custom start if toggle is ON
  map.on("click", (e) => {
    if (!useCustomStart) return;

    customStart = [e.latlng.lat, e.latlng.lng];

    if (customMarker) map.removeLayer(customMarker);
    customMarker = L.marker(customStart, { draggable: true })
      .addTo(map)
      .bindPopup("Custom Start")
      .openPopup();

  setStatus(`Custom start set at ${customStart[0].toFixed(5)}, ${customStart[1].toFixed(5)}`);

  // Allow repositioning the marker
  customMarker.on("dragend", function (e) {
    const pos = e.target.getLatLng();
    customStart = [pos.lat, pos.lng];
    setStatus(`Custom start moved to ${pos.lat.toFixed(5)}, ${pos.lng.toFixed(5)}`);
  });
});

  // Death Road zone
  const noGoZone = {
    north: 56.563270,
    south: 56.550476,
    west: -3.304063,
    east: -3.283458
  };
   
  
   function pointInsideNoGo([lat, lon]) {
     return (
       lat >= noGoZone.south &&
       lat <= noGoZone.north &&
       lon >= noGoZone.west &&
       lon <= noGoZone.east
     );
   }


  function randomPointAwayFromNoGo(lat, lon, offset) {
    let tries = 0;
    while (tries < 10) {
      const jLat = (Math.random() * 2 - 1) * offset * 1.8;
      const jLon = (Math.random() * 2 - 1) * offset * 1.8;
      const p = [lat + jLat, lon + jLon];

    if (!pointInsideNoGo(p)) return p;
    tries++;
  }
  return [lat, lon]; // fallback
}


  function routeIntersectsNoGoZone(latlngs) {
    console.log("Checking latlngs against no-go zone:", latlngs);
    return latlngs.some(([lat, lon]) => {
      const inside =
        lat >= noGoZone.south &&
        lat <= noGoZone.north &&
        lon >= noGoZone.west &&
        lon <= noGoZone.east;
      if (inside) {
        alert(" Death Road Detected");
      }
      return inside;
    });
  }

  // Generate loop
  function generateLoop() {
    if (!lastPosition) {
      setStatus("Waiting for GPS fix...");
      return;
    }

    if (routeLine) {
      map.removeLayer(routeLine);
      routeLine = null;
    }
    map.closePopup();

    const [lat, lon] = customStart || lastPosition;
    const distanceMeters = selectedMiles * 1609.34;
    const degreesPerMeter = 1 / 111139;
    const offset = (distanceMeters / 4.5) * degreesPerMeter;
    const A = [lat, lon];
    const maxAttempts = 5;

    function tryLoop(attempt = 1) {
      if (attempt > maxAttempts) {
        setStatus(" Failed to generate route. All attempts hit no-go zone or were out of bounds.");
        return;
      }

      const B = randomPointAwayFromNoGo(lat, lon, offset);
      const C = randomPointAwayFromNoGo(lat, lon, offset);


      const url = `https://graphhopper.com/api/1/route?point=${lat},${lon}&point=${B[0]},${B[1]}&point=${C[0]},${C[1]}&point=${lat},${lon}&vehicle=foot&locale=en&points_encoded=false&key=${GH_API_KEY}`;

      console.log(` Attempt ${attempt}: Trying route from ${lat},${lon} → ${B[0]},${B[1]} → ${C[0]},${C[1]}`);

      fetch(url)
        .then(res => res.json())
        .then(data => {
          if (!data.paths || data.paths.length === 0) {
            console.warn(" No route found. Retrying...");
            setTimeout(() => tryLoop(attempt + 1), 1000);
            return;
          }

          const coords = data.paths[0].points.coordinates;
          const latlngs = coords.map(([lon, lat]) => [lat, lon]);

          if (routeIntersectsNoGoZone(latlngs)) {
            console.log(` Attempt ${attempt}: Route hits no-go zone.`);
            setTimeout(() => tryLoop(attempt + 1), 1000);
            return;
          }

          const distance = data.paths[0].distance / 1609.34;
          if (distance < minMiles || distance > maxMiles) {
            console.warn(` Distance ${distance.toFixed(2)} mi out of bounds. Retrying...`);
            setTimeout(() => tryLoop(attempt + 1), 1000);
            return;
          }

          const midPoint = latlngs[Math.floor(latlngs.length / 2)];

          routeLine = L.polyline(latlngs, {
            color: "#10b981",
            weight: 4
          }).addTo(map);

         if (followUser) {
           map.fitBounds(routeLine.getBounds());
  }
        //  Save route for reload
        localStorage.setItem("lastRoute", JSON.stringify(latlngs));
        localStorage.setItem("lastDistance", distance);

          L.popup({
            closeButton: false,
            autoClose: false,
            className: "distance-popup"
          })
          .setLatLng(midPoint)
          .setContent(`${distance.toFixed(2)} mi`)
          .openOn(map);

          setStatus(` Route loaded! Distance: ${distance.toFixed(2)} mi`);
        })
        .catch((err) => {
          console.error("Routing error:", err);
          setStatus("Routing failed.");
    });

  }

    tryLoop();
  }

  // Init default distance
  selectDistance(9);
</script>
</body>
</html>

<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Loop Me (GraphHopper Edition)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    body {
      margin: 0;
      font-family: system-ui, sans-serif;
    }
    #map {
      height: 100vh;
    }
    .status {
      position: absolute;
      bottom: 10px;
      left: 10px;
      background: white;
      padding: 8px 12px;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
      font-size: 14px;
    }
    .bar {
      position: absolute;
      top: 10px;
      left: 50px;
      right: 10px;
      z-index: 1000;
      display: flex;
      gap: 8px;
      flex-wrap: nowrap;
      overflow-x: auto;
    }
    .bar button {
      background: white;
      border: 1px solid #ccc;
      border-radius: 12px;
      padding: 10px 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
      font-size: 14px;
    }
    .bar button.primary {
      background: #111;
      color: #fff;
      border-color: #111;
    }
    .bar button:active {
      transform: translateY(1px);
    }
    .bar::-webkit-scrollbar {
      display: none;
    }
    .distance-popup {
      background: #10b981;
      color: white;
      padding: 6px 10px;
      border-radius: 8px;
      font-weight: bold;
      box-shadow: 0 2px 6px rgba(0,0,0,0.2);
      font-size: 13px;
    }
  </style>
</head>
<body>

<div class="bar">
  <button onclick="selectDistance(6)">6 mi</button>
  <button onclick="selectDistance(9)">9 mi</button>
  <button onclick="selectDistance(12)">12 mi</button>
  <button onclick="selectDistance(15)">15 mi</button>
  <button class="primary" onclick="generateLoop()">Loop me</button>
  <button id="followBtn" onclick="toggleFollow()">📍 Follow Me</button>
</div>

<div id="map"></div>
<div class="status" id="status">Loading…</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  const GH_API_KEY = "8b7bdd6e-0343-4430-931c-242dea8d7b20";
  let lastPosition = null;
let routeLine = null;
let selectedDistance = 6;
const maxAttempts = 5;
const offset = 0.03; // ~2 miles
const statusEl = document.getElementById("status");
const setStatus = (text) => statusEl.textContent = text;

const map = L.map("map").setView([56.55, -3.27], 13);
L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
  maxZoom: 19
}).addTo(map);

// No-go zone: [southWestLatLng, northEastLatLng]
const noGoZone = [
  [56.550476, -3.283458],
  [56.563270, -3.304063]
];

// Update selected distance from button click
function selectDistance(miles) {
  selectedDistance = miles;
  console.log(`📏 Distance set to ${miles} mi`);
}

// Checks if any route point falls within the danger zone rectangle
function routeIntersectsNoGoZone(latlngs) {
  const [latMin, lonMin] = [
    Math.min(noGoZone[0][0], noGoZone[1][0]),
    Math.min(noGoZone[0][1], noGoZone[1][1])
  ];
  const [latMax, lonMax] = [
    Math.max(noGoZone[0][0], noGoZone[1][0]),
    Math.max(noGoZone[0][1], noGoZone[1][1])
  ];

  console.log("🧭 Checking latlngs against no-go zone:", latlngs);

  return latlngs.some(([lat, lon]) => {
    const inside =
      lat >= latMin && lat <= latMax &&
      lon >= lonMin && lon <= lonMax;
    if (inside) {
      console.log("🚫 Route intersects no-go zone at:", lat, lon);
    }
    return inside;
  });
}

function tryLoop(attempt = 1) {
  if (attempt > maxAttempts) {
    setStatus("🚫 Failed to generate route. All attempts hit no-go zone.");
    return;
  }

  const miles = parseFloat(document.querySelector(".bar button.selected")?.textContent) || 6;
  const offset = miles / 69; // approx degrees for given miles

  // Random jitter to create variation in triangle
  const jitterLat = (Math.random() - 0.5) * offset * 2;
  const jitterLon = (Math.random() - 0.5) * offset * 2;

  const B = [lat + jitterLat, lon + jitterLon];
  const C = [lat - jitterLat, lon - jitterLon];

  const url = `https://graphhopper.com/api/1/route?point=${lat},${lon}&point=${B[0]},${B[1]}&point=${C[0]},${C[1]}&point=${lat},${lon}&vehicle=foot&locale=en&points_encoded=false&key=${GH_API_KEY}`;

  console.log(`🌀 Attempt ${attempt}: Trying route from ${lat},${lon} → ${B} → ${C}`);

  fetch(url)
    .then(res => res.json())
    .then(data => {
      const coords = data.paths?.[0]?.points?.coordinates;
      if (!coords || coords.length === 0) {
        console.warn("No coordinates in response");
        setStatus("⚠️ No route found.");
        return tryLoop(attempt + 1);
      }

      const latlngs = coords.map(([lon, lat]) => [lat, lon]);
      console.log("🧭 Checking route for no-go zone...");
      console.log("Checking latlngs against no-go zone:", latlngs);

      if (routeIntersectsNoGoZone(latlngs)) {
        console.log(`🚫 Attempt ${attempt}: Route hits no-go zone.`);
        return tryLoop(attempt + 1);
      }

      if (routeLine) map.removeLayer(routeLine);

      routeLine = L.polyline(latlngs, {
        color: "#10b981",
        weight: 4
      }).addTo(map);

      const distanceMeters = data.paths[0].distance;
      const distanceMiles = (distanceMeters / 1609.34).toFixed(2);
      const midIndex = Math.floor(latlngs.length / 2);
      const midPoint = latlngs[midIndex];

      L.popup({
        closeButton: false,
        autoClose: false,
        className: 'distance-popup'
      })
        .setLatLng(midPoint)
        .setContent(`${distanceMiles} mi`)
        .openOn(map);

      map.fitBounds(routeLine.getBounds());
      setStatus(`✅ Loop generated! Distance: ${distanceMiles} mi`);
    })
    .catch((err) => {
      console.error("Routing error:", err);
      setStatus("Routing failed.");
    });
}


function generateLoop() {
  if (!lastPosition) {
    setStatus("⚠️ Waiting for GPS fix...");
    return;
  }

  const { latitude: lat, longitude: lon } = lastPosition.coords;
  tryLoop(lat, lon, 1);
}

// Start GPS tracking
navigator.geolocation.watchPosition(pos => {
  lastPosition = pos;
}, err => {
  console.error("GPS error:", err);
  setStatus("⚠️ GPS unavailable.");
});

</script>
</body>
</html>
